name: Android Vulkan Test APK

on:
  workflow_dispatch:
  push:
    branches: [ feature/gs-vulkan-android ]
    paths:
      - 'android-vulkan-test/**'
      - '.github/workflows/android-vulkan-test.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install NDK and CMake
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Build debug APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then ./gradlew -p android-vulkan-test assembleDebug; else gradle -p android-vulkan-test assembleDebug; fi
      - uses: actions/upload-artifact@v4
        with:
          name: PS2Recomp-Vulkan-Test-APK
          path: android-vulkan-test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
