plugins { id 'com.android.application' }

android {
    namespace 'com.ps2recomp.vulkantest'
    compileSdk 34
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.ps2recomp.vulkantest'
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -Wall -Wextra'
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }

    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
}
